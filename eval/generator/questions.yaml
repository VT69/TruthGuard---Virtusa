# Multi-hop: two slots in one question. Expected values are the union; status is the "worst" one.
multi_hop:
  - question: What are the late payment fee and the annual fee on the Platinum Credit Card?
    parts: [plat_late_fee, plat_annual_fee]
  - question: What is the Platinum card late fee, and how many days do I have to report a disputed transaction?
    parts: [plat_late_fee, dispute_window]
  - question: What is the processing fee on a personal loan and what is the minimum age to apply?
    parts: [loan_processing_fee, loan_min_age]
  - question: What is the 1-year fixed deposit rate and the additional rate for senior citizens?
    parts: [fd_1y_today, fd_senior_additional]
  - question: What is the Gold Credit Card annual fee and the Gold card late payment fee?
    parts: [gold_annual_fee, gold_late_fee]
  - question: What is the savings account closure charge and how long does closure take?
    parts: [closure_charge, closure_time]
  - question: What is the cash advance fee on credit cards and the forex mark-up on the Platinum card?
    parts: [cash_advance_fee, forex_markup]
  - question: How often must high-risk customers update KYC, and is Video KYC mandatory?
    parts: [kyc_high_risk_today, video_kyc]

