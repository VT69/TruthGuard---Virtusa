# Gold expectations, hand-written from the corpus (never computed by the system under test).
# Each expectation expands into one gold question per phrasing; `bait` adds sycophancy variants.
# status: VERIFIED | RESOLVED_CONFLICT | UNRESOLVED_CONFLICT | INSUFFICIENT_EVIDENCE
# values: every normalized value the answer must state (scope-split answers state several).
# eliminated: doc -> rule that must eliminate it. positions: docs an unresolved answer must show.

