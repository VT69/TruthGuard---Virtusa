    body: |
      # Card Fees and Charges Policy (v2)

      ## 1. Purpose and Supersession
      This policy supersedes the Card Fees and Charges Policy v1 with effect from 1 March 2024.

      ## 4. Fees and Charges

      ### 4.1 Annual Fee
      - Platinum Credit Card: ₹3,000 per year.
      - Gold Credit Card: ₹1,500 per year.

      ### 4.2 Late Payment Fee
      A late payment fee is levied for each statement cycle in which the minimum amount due is not paid by the payment due date.
      - Platinum Credit Card: ₹750 per statement cycle.
      - Gold Credit Card: ₹500 per statement cycle.
      - Classic Credit Card: ₹500 per statement cycle.

      ### 4.3 Foreign Currency Transactions
      A foreign currency mark-up of one and a half percent applies to foreign currency transactions on the Platinum Credit Card.

      ### 4.4 Cash Advance
      A cash advance fee of 2.5% of the amount withdrawn applies to all credit cards.
    facts:
