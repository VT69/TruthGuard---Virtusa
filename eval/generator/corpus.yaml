# Northwind Bank (fictional) synthetic corpus. ALL values are invented test data.
#
# Each document lists the facts it asserts (`facts`: subject, attribute, scope, value_norm).
# `meta_style` controls how metadata reaches the parser:
#   frontmatter  YAML frontmatter (explicit)          properties  DOCX/PDF/HTML properties (explicit)
#   header       "Effective from:" lines in the text  none        nothing; must be inferred
# Ground truth for lineage lives in `edges`, for resolution in `cases` (see questions.yaml).

