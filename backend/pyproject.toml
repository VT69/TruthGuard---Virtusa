[project]
name = "truthguard"
version = "0.1.0"
description = "TruthGuard: adversarial verification for multi-agent document Q&A over inconsistent corpora"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavier, optional model backends. The default build runs fully on CPU without them.
models = ["sentence-transformers>=3.0"]
llm = ["litellm>=1.50"]
eval = ["fpdf2>=2.7", "matplotlib>=3.8"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]

[project.scripts]
truthguard = "truthguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truthguard"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "../eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "N"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLC0415",
    "RUF001", "RUF002", "RUF003",  # the corpus legitimately uses the rupee sign and typographic quotes
]

[tool.ruff.lint.pycodestyle]
max-line-length = 130  # the formatter wraps at 110; long string literals may run to 130

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "N802", "B011"]
"src/truthguard/ingestion/lineage.py" = ["E501"]  # regex patterns read better unbroken

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["truthguard"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "pgvector.*", "sentence_transformers.*", "litellm.*", "fpdf.*", "matplotlib.*", "prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]
markers = [
    "postgres: requires TEST_POSTGRES_URL",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/truthguard"]
branch = true
