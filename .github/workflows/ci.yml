name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truthguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: backend
        run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: .venv/bin/ruff check src tests ../eval ../scripts && .venv/bin/ruff format --check src tests ../eval ../scripts
      - name: Typecheck (mypy --strict)
        working-directory: backend
        run: .venv/bin/mypy
      - name: Corpus generator is reproducible
        run: |
          backend/.venv/bin/python eval/generator/generate.py --out /tmp/corpus --datasets /tmp/datasets
          diff -r /tmp/corpus data/sample_corpus && diff -r /tmp/datasets eval/datasets
      - name: Tests (no API keys needed)
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/truthguard_test
        run: .venv/bin/pytest --cov --cov-report=term-missing:skip-covered
      - name: Migrations apply on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/truthguard_test
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          cd backend && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
          cd ../frontend && npm ci && npx playwright install --with-deps chromium
      - name: Lint and typecheck
        working-directory: frontend
        run: npx next lint && npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: E2E (demo script)
        working-directory: frontend
        run: CI=1 npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
