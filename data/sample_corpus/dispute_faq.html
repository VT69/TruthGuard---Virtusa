    <h1>Card Dispute FAQ</h1>
    <h2>How long do I have to report a disputed transaction?</h2>
    <p>You must report a disputed transaction within 30 days of the statement date.</p>
    <h2>Am I liable for fraud on my card?</h2>
    <p>Customers bear zero liability for unauthorised transactions reported within 3 days.</p>
