    <h1>Fixed Deposit FAQ</h1>
    <h2>What interest does a 1-year fixed deposit earn?</h2>
    <p>A fixed deposit with a 1-year tenor earns an interest rate of 6.5% per annum.</p>
    <h2>Do senior citizens get a higher rate?</h2>
    <p>Yes, senior citizens receive an additional rate of half a percent on fixed deposits.</p>
